<!doctype html><meta charset="utf-8"><title>process model</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}</script>
<body style="background:#111;color:#eee;font:12px/1.4 monospace;margin:12px"><pre id="out">loading…</pre>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
const out = document.getElementById('out'); const log = (s) => { out.textContent += s + '\n'; };
out.textContent = '';
try {
  const draco = new DRACOLoader(); draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
  const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
  const t0 = performance.now();
  const gltf = await loader.loadAsync('/gasmax/assets/gasmax.glb');
  log('loaded in ' + Math.round(performance.now() - t0) + ' ms');
  const root = gltf.scene; root.updateMatrixWorld(true);
  const rows = []; let tris = 0, verts = 0;
  root.traverse(o => { if (o.isMesh) { const g = o.geometry; const t = g.index ? g.index.count / 3 : g.attributes.position.count / 3; tris += t; verts += g.attributes.position.count; g.computeBoundingBox(); const bb = g.boundingBox.clone().applyMatrix4(o.matrixWorld); const s = bb.getSize(new THREE.Vector3()), c = bb.getCenter(new THREE.Vector3()); const m = o.material; rows.push([o.name, m.name, Math.round(t), m.map ? 'map' : '-', m.color ? m.color.getHexString() : '', m.emissive ? m.emissive.getHexString() + '/' + m.emissiveIntensity : '', 'size ' + [s.x, s.y, s.z].map(v => v.toFixed(2)).join(','), 'ctr ' + [c.x, c.y, c.z].map(v => v.toFixed(2)).join(','), Object.keys(g.attributes).join('+')]); } });
  const bbAll = new THREE.Box3().setFromObject(root); const sz = bbAll.getSize(new THREE.Vector3()), ce = bbAll.getCenter(new THREE.Vector3());
  log('meshes ' + rows.length + ' | tris ' + tris + ' | verts ' + verts + ' | bbox size ' + sz.toArray().map(v => v.toFixed(2)).join(',') + ' | center ' + ce.toArray().map(v => v.toFixed(2)).join(',') + ' | min.y ' + bbAll.min.y.toFixed(2));
  const lights = []; root.traverse(o => { if (o.isLight) lights.push(o.type + ' "' + o.name + '" i=' + o.intensity + ' #' + o.color.getHexString() + ' @' + o.getWorldPosition(new THREE.Vector3()).toArray().map(v => v.toFixed(2)).join(',')); });
  log('lights: ' + (lights.join(' | ') || 'none'));
  const groups = []; root.traverse(o => { if (!o.isMesh && !o.isLight && o.name) { const b = new THREE.Box3().setFromObject(o); if (!b.isEmpty()) { const s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3()); groups.push(o.name + ' size ' + [s.x, s.y, s.z].map(v => v.toFixed(2)).join(',') + ' ctr ' + [c.x, c.y, c.z].map(v => v.toFixed(2)).join(',')); } } });
  log('groups:\n  ' + groups.join('\n  '));
  log('mesh | material | tris | map | color | emissive | size | center | attrs');
  rows.forEach(r => log('  ' + r.join(' | ')));
  root.traverse(o => { if (o.isMesh) { const g = o.geometry; ['uv', 'uv1', 'uv2', 'uv3', 'color', 'tangent', 'normal'].forEach(a => { if (g.getAttribute(a)) g.deleteAttribute(a); }); const m = o.material; ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap', 'alphaMap', 'specularMap', 'bumpMap'].forEach(k => { if (m[k]) { m[k].dispose(); m[k] = null; } }); m.needsUpdate = true; } });
  const exporter = new GLTFExporter();
  const buf = await exporter.parseAsync(root, { binary: true, onlyVisible: false });
  log('exported bytes: ' + buf.byteLength);
  const res = await fetch('/upload?name=gasmax-lite.glb', { method: 'POST', body: buf });
  log('upload: ' + res.status + ' ' + await res.text());
  log('DONE');
} catch (e) { log('ERROR: ' + (e && (e.stack || e.message || e))); }
</script>
